# Netlify configuration
[build]
  command = "npm run build"
  publish = "dist"

# Functions are auto-detected in netlify/functions/
# No additional config needed for Python functions

# Redirect rules (optional - for cleaner URLs)
[[redirects]]
  from = "/api/notify/*"
  to = "/.netlify/functions/n8n-proxy/:splat"
  status = 200
  force = true

# Headers for CORS
[[headers]]
  for = "/.netlify/functions/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Headers = "Content-Type, Authorization"
    Access-Control-Allow-Methods = "GET, POST, OPTIONS"
