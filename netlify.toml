# Netlify configuration
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Supabase URL + anon key are intentionally public (anon JWT is RLS-protected).
  SECRETS_SCAN_OMIT_KEYS = "VITE_SUPABASE_URL,VITE_SUPABASE_PUBLISHABLE_KEY,VITE_SUPABASE_ANON_KEY,FROM_EMAIL"

# Functions are auto-detected in netlify/functions/

# Legacy n8n proxy (kept for backwards compatibility)
[[redirects]]
  from = "/api/notify/*"
  to = "/.netlify/functions/n8n-proxy/:splat"
  status = 200
  force = true

# SPA fallback - serve index.html for all routes (must be last)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Headers for CORS
[[headers]]
  for = "/.netlify/functions/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Headers = "Content-Type, Authorization"
    Access-Control-Allow-Methods = "GET, POST, OPTIONS"
