# Serverless Framework configuration for n8n proxy Lambda function (Python)
# Deploy with: serverless deploy

service: inventory-n8n-proxy

provider:
  name: aws
  runtime: python3.12
  stage: ${opt:stage, 'prod'}
  region: us-east-1  # Change to your preferred region
  memorySize: 256
  timeout: 30

  # IAM role permissions
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - logs:CreateLogGroup
            - logs:CreateLogStream
            - logs:PutLogEvents
          Resource: arn:aws:logs:*:*:*

  # Environment variables
  # IMPORTANT: Update these with your n8n server IP/domain
  environment:
    N8N_ORDER_PLACED_URL: ${env:N8N_ORDER_PLACED_URL, 'http://your-n8n-server:5678/webhook/order-placed'}
    N8N_ORDER_PICKED_URL: ${env:N8N_ORDER_PICKED_URL, 'http://your-n8n-server:5678/webhook/order-picked'}
    N8N_ORDER_DISPATCHED_URL: ${env:N8N_ORDER_DISPATCHED_URL, 'http://your-n8n-server:5678/webhook/order-dispatched'}

functions:
  # Single Lambda function that routes to different n8n webhooks
  n8nProxy:
    handler: n8n_proxy.lambda_handler
    name: ${self:service}-${self:provider.stage}
    description: Intelligent router for n8n webhook notifications (order-placed/picked/dispatched)
    events:
      # Root endpoint with query parameter routing
      # Usage: POST /notify?type=order-placed
      - httpApi:
          path: /notify
          method: post
      - httpApi:
          path: /notify
          method: options

      # Path-based routing endpoints
      # Usage: POST /order-placed
      - httpApi:
          path: /order-placed
          method: post
      - httpApi:
          path: /order-placed
          method: options

      - httpApi:
          path: /order-picked
          method: post
      - httpApi:
          path: /order-picked
          method: options

      - httpApi:
          path: /order-dispatched
          method: post
      - httpApi:
          path: /order-dispatched
          method: options

# Package configuration
package:
  individually: false
  patterns:
    - '!node_modules/**'
    - '!.git/**'
    - '!*.md'
    - '!*.json'
    - n8n_proxy.py
    - requirements.txt

# Python plugins
plugins:
  - serverless-python-requirements

custom:
  pythonRequirements:
    dockerizePip: false  # Set to true if you need compiled dependencies
    slim: true
    strip: false

# CloudFormation outputs
resources:
  Outputs:
    HttpApiUrl:
      Description: "HTTP API Gateway URL"
      Value:
        Fn::Sub: "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com"

    NotifyEndpoint:
      Description: "Main notification endpoint (use ?type= parameter)"
      Value:
        Fn::Sub: "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/notify"

    OrderPlacedEndpoint:
      Description: "Order Placed Notification Endpoint"
      Value:
        Fn::Sub: "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/order-placed"

    OrderPickedEndpoint:
      Description: "Order Picked Notification Endpoint"
      Value:
        Fn::Sub: "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/order-picked"

    OrderDispatchedEndpoint:
      Description: "Order Dispatched Notification Endpoint"
      Value:
        Fn::Sub: "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/order-dispatched"
